[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olmo3-mindspeed-pipeline"
version = "0.1.0"
description = "Composable OLMo 3 Stage 1-4 pipeline for MindSpeed/Megatron on Ascend"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
olmo3ctl = "olmo3_pipeline.cli:main"
olmo3ckpt = "olmo3_pipeline.checkpoint_cli:main"
olmo3eval = "olmo3_pipeline.evaluation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["olmo3_pipeline*", "modeling*", "runtime*", "llama_config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
